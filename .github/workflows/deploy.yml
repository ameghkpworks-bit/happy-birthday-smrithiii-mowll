name: Deploy Birthday Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Fix Vite permissions
        run: chmod +x node_modules/.bin/vite

      - name: Build website
        run: npm run build
        env:
          NITRO_PRESET: github-pages

      - name: Verify website output
        run: |
          echo "======================================"
          echo "Generated website files:"
          echo "======================================"
          find .output/public -maxdepth 2 -type f -print
          echo "======================================"
          echo "Checking for index.html..."
          echo "======================================"
          test -f .output/public/index.html
          echo "SUCCESS: index.html exists!"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.output/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployment URL
        run: echo "Website deployed to ${{ steps.deployment.outputs.page_url }}"
